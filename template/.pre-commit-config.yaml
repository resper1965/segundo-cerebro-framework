repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: brain-check
        name: brain-check
        entry: python3 _system/ferramentas/brain_check.py .
        language: system
        pass_filenames: false
        always_run: true
